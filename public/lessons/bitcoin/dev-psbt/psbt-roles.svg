<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">PSBT roles</title>
  <desc id="desc">Creator, updater, signers, finalizer, and extractor roles in a PSBT workflow.</desc>
  <rect width="720" height="260" fill="#0b0f14"/>
  <rect x="20" y="100" width="110" height="50" fill="#15202b" stroke="#5a7a94" stroke-width="2"/>
  <text x="75" y="130" fill="#e8eef4" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">Creator</text>
  <rect x="160" y="100" width="110" height="50" fill="#15202b" stroke="#5a7a94" stroke-width="2"/>
  <text x="215" y="130" fill="#e8eef4" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">Updater</text>
  <rect x="300" y="100" width="110" height="50" fill="#15202b" stroke="#4a9e6e" stroke-width="2"/>
  <text x="355" y="130" fill="#e8eef4" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">Signers</text>
  <rect x="440" y="100" width="110" height="50" fill="#15202b" stroke="#5a7a94" stroke-width="2"/>
  <text x="495" y="130" fill="#e8eef4" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">Finalizer</text>
  <rect x="580" y="100" width="120" height="50" fill="#1a2836" stroke="#c9a227" stroke-width="2"/>
  <text x="640" y="130" fill="#e8eef4" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">Broadcast</text>
  <path d="M130 125 H160" stroke="#6b8ca8" stroke-width="2"/>
  <path d="M270 125 H300" stroke="#6b8ca8" stroke-width="2"/>
  <path d="M410 125 H440" stroke="#6b8ca8" stroke-width="2"/>
  <path d="M550 125 H580" stroke="#6b8ca8" stroke-width="2"/>
  <text x="360" y="200" fill="#8aa0b5" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">PSBT carries partial signatures and metadata between roles</text>
</svg>
