<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">UTXO spend flow</title>
  <desc id="desc">Two inputs are consumed to create a payment output and a change output, with a fee.</desc>
  <rect width="720" height="320" fill="#0b0f14"/>
  <rect x="24" y="48" width="140" height="64" fill="#15202b" stroke="#3d4f5f" stroke-width="2"/>
  <text x="94" y="78" fill="#e8eef4" font-family="ui-monospace,monospace" font-size="13" text-anchor="middle">Input A</text>
  <text x="94" y="96" fill="#8aa0b5" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">0.05 BTC</text>
  <rect x="24" y="140" width="140" height="64" fill="#15202b" stroke="#3d4f5f" stroke-width="2"/>
  <text x="94" y="170" fill="#e8eef4" font-family="ui-monospace,monospace" font-size="13" text-anchor="middle">Input B</text>
  <text x="94" y="188" fill="#8aa0b5" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">0.02 BTC</text>
  <path d="M164 80 H220" stroke="#6b8ca8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M164 172 H220" stroke="#6b8ca8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="220" y="88" width="160" height="80" fill="#1a2836" stroke="#5a7a94" stroke-width="2"/>
  <text x="300" y="122" fill="#e8eef4" font-family="ui-monospace,monospace" font-size="13" text-anchor="middle">Transaction</text>
  <text x="300" y="144" fill="#8aa0b5" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">consume + create</text>
  <path d="M380 112 H440" stroke="#6b8ca8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M380 148 H440" stroke="#6b8ca8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="440" y="48" width="160" height="64" fill="#15202b" stroke="#4a9e6e" stroke-width="2"/>
  <text x="520" y="78" fill="#e8eef4" font-family="ui-monospace,monospace" font-size="13" text-anchor="middle">Payment</text>
  <text x="520" y="96" fill="#8aa0b5" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">0.06 BTC</text>
  <rect x="440" y="140" width="160" height="64" fill="#15202b" stroke="#5a7a94" stroke-width="2"/>
  <text x="520" y="170" fill="#e8eef4" font-family="ui-monospace,monospace" font-size="13" text-anchor="middle">Change</text>
  <text x="520" y="188" fill="#8aa0b5" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">0.009 BTC</text>
  <text x="520" y="250" fill="#c9a227" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">Fee = 0.001 BTC (no output)</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b8ca8"/>
    </marker>
  </defs>
</svg>
