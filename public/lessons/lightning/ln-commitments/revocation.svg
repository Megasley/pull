<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Commitment revocation</title>
  <desc id="desc">Publishing an old commitment allows the peer to take all funds via a penalty transaction.</desc>
  <rect width="720" height="280" fill="#0b0f14"/>
  <rect x="40" y="40" width="200" height="80" fill="#15202b" stroke="#5a7a94" stroke-width="2"/>
  <text x="140" y="75" fill="#e8eef4" font-family="ui-monospace,monospace" font-size="13" text-anchor="middle">Commitment n</text>
  <text x="140" y="95" fill="#8aa0b5" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">current state</text>
  <rect x="260" y="40" width="200" height="80" fill="#15202b" stroke="#3d4f5f" stroke-width="2"/>
  <text x="360" y="75" fill="#e8eef4" font-family="ui-monospace,monospace" font-size="13" text-anchor="middle">Commitment n-1</text>
  <text x="360" y="95" fill="#8aa0b5" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">revoked (old)</text>
  <rect x="480" y="40" width="200" height="80" fill="#2a1515" stroke="#c45c5c" stroke-width="2"/>
  <text x="580" y="75" fill="#e8eef4" font-family="ui-monospace,monospace" font-size="13" text-anchor="middle">Broadcast old?</text>
  <text x="580" y="95" fill="#c45c5c" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">penalty risk</text>
  <path d="M360 120 V160" stroke="#c45c5c" stroke-width="2" marker-end="url(#a)"/>
  <rect x="220" y="170" width="280" height="70" fill="#15202b" stroke="#c45c5c" stroke-width="2"/>
  <text x="360" y="200" fill="#e8eef4" font-family="ui-monospace,monospace" font-size="13" text-anchor="middle">Justice / penalty tx</text>
  <text x="360" y="220" fill="#8aa0b5" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">Peer claims all channel funds</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c45c5c"/></marker>
  </defs>
</svg>
