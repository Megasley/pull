<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">HTLC multi-hop payment</title>
  <desc id="desc">Alice pays Carol through Bob using the same payment hash and decreasing timelocks.</desc>
  <rect width="720" height="280" fill="#0b0f14"/>
  <rect x="40" y="100" width="120" height="60" fill="#15202b" stroke="#4a9e6e" stroke-width="2"/>
  <text x="100" y="135" fill="#e8eef4" font-family="ui-monospace,monospace" font-size="13" text-anchor="middle">Alice</text>
  <rect x="300" y="100" width="120" height="60" fill="#15202b" stroke="#5a7a94" stroke-width="2"/>
  <text x="360" y="135" fill="#e8eef4" font-family="ui-monospace,monospace" font-size="13" text-anchor="middle">Bob</text>
  <rect x="560" y="100" width="120" height="60" fill="#15202b" stroke="#4a9e6e" stroke-width="2"/>
  <text x="620" y="135" fill="#e8eef4" font-family="ui-monospace,monospace" font-size="13" text-anchor="middle">Carol</text>
  <path d="M160 120 H300" stroke="#6b8ca8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M420 120 H560" stroke="#6b8ca8" stroke-width="2" marker-end="url(#a)"/>
  <text x="230" y="108" fill="#8aa0b5" font-family="ui-monospace,monospace" font-size="10" text-anchor="middle">HTLC H, T=40</text>
  <text x="490" y="108" fill="#8aa0b5" font-family="ui-monospace,monospace" font-size="10" text-anchor="middle">HTLC H, T=20</text>
  <path d="M560 170 H420" stroke="#c9a227" stroke-width="2" marker-end="url(#b)"/>
  <path d="M300 170 H160" stroke="#c9a227" stroke-width="2" marker-end="url(#b)"/>
  <text x="360" y="210" fill="#c9a227" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">preimage R reveals backward ’ atomic settlement</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6b8ca8"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c9a227"/></marker>
  </defs>
</svg>
